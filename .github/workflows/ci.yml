name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes e tipos (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 já saiu do suporte e não é publicado nas imagens "latest"
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.12"
            os: ubuntu-latest
          - python: "3.14"
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rodar a suíte (offline)
        run: python -m pytest -q

      - name: Verificar tipos
        run: python -m pyright

  pacote:
    name: Empacotar e validar o wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construir sdist e wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Instalar o wheel em venv limpo e validar a interface
        run: |
          python -m venv /tmp/venv-pacote
          /tmp/venv-pacote/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv-pacote/bin/python -c "from iplocator_core.api import DIRETORIO_WEB_PADRAO as w; assert (w / 'index.html').is_file(), w; print('interface encontrada em', w)"
          /tmp/venv-pacote/bin/iplocator --version

      - name: Publicar artefatos da build
        uses: actions/upload-artifact@v4
        with:
          name: pacote-python
          path: dist/*
          retention-days: 7
