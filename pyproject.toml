[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iplocator"
version = "2.0.0"
description = "OSINT de geolocalização de IPs, scanner de portas com detecção de serviços e WHOIS/RDAP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SpetsnazBR", email = "brunoaalvim@icloud.com" }]
keywords = ["osint", "geolocation", "port-scanner", "whois", "rdap", "vue"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "requests>=2.28",
    "pyfiglet>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyright>=1.1"]

[project.scripts]
iplocator = "iplocator:main"

[project.urls]
Homepage = "https://github.com/SpetsnazBR/iplocator"
Issues = "https://github.com/SpetsnazBR/iplocator/issues"

[tool.setuptools]
py-modules = ["iplocator"]

[tool.setuptools.packages.find]
include = ["iplocator_core*"]

# A interface web fica fora do pacote Python; estes data-files a colocam em
# <prefix>/share/iplocator/web, caminho consultado por resolver_diretorio_web().
[tool.setuptools.data-files]
"share/iplocator/web" = ["web/index.html", "web/app.js", "web/styles.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
# Mesmo motor do Pylance (VS Code). Rode: python -m pyright
include = ["iplocator.py", "iplocator_core", "tests", "tools"]
exclude = [".venv", "**/__pycache__", "web", "build", "dist"]
pythonVersion = "3.9"
typeCheckingMode = "basic"
extraPaths = [".", "tests"]
reportMissingTypeStubs = "none"
